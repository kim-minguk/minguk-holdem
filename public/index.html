<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>민국 홀덤 온라인</title>
<style>*{box-sizing:border-box}body{margin:0;background:#06110c;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.w{max-width:1100px;margin:auto;padding:12px}.head{display:flex;justify-content:space-between;align-items:center}.tag{background:#e9c46a;color:#111;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:900}.p{background:#ffffff10;border:1px solid #ffffff20;border-radius:15px;padding:13px;margin:8px 0}.row{display:flex;gap:7px;flex-wrap:wrap}input,select,button{border:0;border-radius:9px;padding:10px;font-weight:800}input,select{background:#fff;color:#111}button{cursor:pointer}.g{background:#e9c46a}.r{background:#ef476f;color:#fff}.b{background:#4cc9f0}.table{height:650px;position:relative;border-radius:45%/32%;background:radial-gradient(ellipse,#168057,#0d6744 55%,#063d29);border:13px solid #432916;overflow:hidden;box-shadow:0 20px 60px #0008}.center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;width:70%}.pot{display:inline-block;background:#0008;padding:7px 13px;border-radius:20px;font-weight:900}.board,.cards{display:flex;justify-content:center;gap:6px}.board{min-height:82px;margin:9px}.card{width:55px;height:78px;background:#fff;color:#111;border-radius:7px;padding:5px;font-weight:900;display:flex;flex-direction:column;justify-content:space-between}.redc{color:#d62828}.suit{font-size:24px;text-align:center}.back{background:repeating-linear-gradient(45deg,#133b8b,#133b8b 7px,#2461d5 7px,#2461d5 14px);border:2px solid white}.seat{position:absolute;width:170px;text-align:center}.box{background:#0009;border:1px solid #ffffff22;border-radius:12px;padding:7px}.active .box{outline:3px solid #e9c46a}.fold{opacity:.42}.cards{height:62px}.cards .card{width:42px;height:59px}.cards .suit{font-size:18px}.s0{left:50%;bottom:14px;transform:translateX(-50%)}.s1{left:6%;bottom:115px}.s2{left:5%;top:100px}.s3{left:50%;top:10px;transform:translateX(-50%)}.s4{right:5%;top:100px}.s5{right:6%;bottom:115px}.ctrl{position:absolute;left:50%;bottom:116px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:80%;z-index:4}.raisebox{background:#0008;padding:4px;border-radius:9px;display:flex;gap:5px;align-items:center}input[type=range]{padding:0;width:130px}.small{font-size:12px;color:#bed1c6}.msg{font-weight:900;color:#ffe29a;margin-top:8px}.hide{display:none}.invite{word-break:break-all;color:#bde0fe}
@media(max-width:720px){.table{height:720px;border-radius:26px}.seat{width:128px}.s1{left:2px;bottom:115px}.s5{right:2px;bottom:115px}.s2{left:2px;top:120px}.s4{right:2px;top:120px}.center{top:43%;width:96%}.ctrl{bottom:145px;width:96%}.card{width:46px;height:66px}}</style></head>
<body><div class="w"><div class="head"><h2>♠ 민국 홀덤</h2><span class="tag">ONLINE FRIENDS</span></div>
<div id="lobby" class="p"><div class="row"><input id="name" value="민국" placeholder="닉네임"><input id="pw" placeholder="방 비밀번호(선택)"><select id="startchips"><option value="5000">5,000칩</option><option value="10000" selected>10,000칩</option><option value="20000">20,000칩</option><option value="50000">50,000칩</option></select><select id="blind"><option value="25,50">25/50</option><option value="50,100" selected>50/100</option><option value="100,200">100/200</option></select><select id="max"><option>2</option><option>4</option><option selected>6</option></select><button class="g" id="create">방 만들기</button></div><hr style="border-color:#ffffff18"><div class="row"><input id="code" maxlength="5" placeholder="방 코드"><input id="jpw" placeholder="비밀번호"><button id="join">방 입장</button></div><div class="small" style="margin-top:8px">무료 게임 포인트 전용 · 최대 6명</div></div>
<div id="game" class="hide"><div class="p"><div class="row" style="justify-content:space-between"><div>방 <b id="rcode"></b> · <span id="phase"></span></div><div class="row"><button id="copy">초대 링크 복사</button><button class="g" id="start">핸드 시작</button></div></div><div class="invite" id="invite"></div></div>
<div class="table"><div class="center"><div class="pot" id="pot"></div><div class="board" id="board"></div><div class="small" id="street"></div><div class="msg" id="msg"></div></div>
<div id="s0" class="seat s0"></div><div id="s1" class="seat s1"></div><div id="s2" class="seat s2"></div><div id="s3" class="seat s3"></div><div id="s4" class="seat s4"></div><div id="s5" class="seat s5"></div>
<div class="ctrl"><button class="r" id="fold">FOLD</button><button id="call">CHECK</button><div class="raisebox"><input type="range" id="range" step="10"><span id="rv"></span><button class="b" id="raise">RAISE</button></div><button class="g" id="allin">ALL-IN</button></div></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=x=>document.getElementById(x),money=n=>(n||0).toLocaleString("ko-KR");let st=null;
const q=new URLSearchParams(location.search);if(q.get("room"))$("code").value=q.get("room").toUpperCase();
function card(c,b=false){if(b)return'<div class="card back"></div>';return`<div class="card${c.s==="♥"||c.s==="♦"?" redc":""}"><span>${c.r}</span><span class="suit">${c.s}</span></div>`}
$("create").onclick=()=>{let [sb,bb]=$("blind").value.split(",").map(Number);s.emit("create",{name:$("name").value,password:$("pw").value,start:+$("startchips").value,sb,bb,max:+$("max").value})};
$("join").onclick=()=>s.emit("join",{code:$("code").value,password:$("jpw").value,name:$("name").value});$("start").onclick=()=>s.emit("start");
$("fold").onclick=()=>s.emit("act",{type:"fold"});$("call").onclick=()=>s.emit("act",{type:"call"});$("raise").onclick=()=>s.emit("act",{type:"raise",amount:+$("range").value});$("allin").onclick=()=>s.emit("act",{type:"allin"});$("range").oninput=e=>$("rv").textContent=money(+e.target.value);
$("copy").onclick=async()=>{let u=location.origin+location.pathname+"?room="+st.code;try{await navigator.clipboard.writeText(u);alert("초대 링크를 복사했습니다.")}catch(e){prompt("이 링크를 복사하세요",u)}};
s.on("err",m=>alert(m));s.on("state",x=>{st=x;$("lobby").classList.add("hide");$("game").classList.remove("hide");render()});
function render(){let mi=st.players.findIndex(p=>p.token===st.me),me=st.players[mi];$("rcode").textContent=st.code;$("phase").textContent=st.phase==="lobby"?"대기실":st.phase==="playing"?"게임 중":"핸드 종료";$("pot").textContent="POT "+money(st.pot);$("board").innerHTML=st.board.map(c=>card(c)).join("");$("street").textContent=({preflop:"프리플랍",flop:"플랍",turn:"턴",river:"리버"}[st.street]||"대기")+" · #"+st.handNo+" · "+st.settings.sb+"/"+st.settings.bb;$("msg").textContent=st.msg||"";$("start").style.display=st.host&&st.phase!=="playing"?"block":"none";let url=location.origin+location.pathname+"?room="+st.code;$("invite").textContent="초대: "+url;
for(let slot=0;slot<6;slot++){let i=st.players.length?(mi+slot)%st.players.length:-1,p=i>=0?st.players[i]:null,e=$("s"+slot);if(!p){e.innerHTML="";e.className="seat s"+slot;continue}e.className=`seat s${slot}${st.turn===i&&st.phase==="playing"?" active":""}${p.folded?" fold":""}`;let cs=p.cards.length?p.cards.map(c=>card(c)).join(""):(p.inHand&&st.phase==="playing"?card(null,true)+card(null,true):"");e.innerHTML=`<div class="cards">${cs}</div><div class="box"><b>${p.name}${i===st.dealer?" 🔘":""}${i===mi?" (나)":""}</b><br><span style="color:#f6d365">${money(p.chips)}칩</span><br><span class="small">${p.bet?"BET "+money(p.bet):""} ${p.allin?"ALL-IN":""} ${p.folded?"FOLD":""}</span></div>`}
let turn=st.phase==="playing"&&st.turn===mi,call=Math.max(0,st.currentBet-(me?.bet||0));["fold","call","raise","allin"].forEach(x=>$(x).disabled=!turn);$("call").textContent=call?"CALL "+money(Math.min(call,me.chips)):"CHECK";let mn=Math.min(me.bet+me.chips,st.currentBet+st.minRaise),mx=me.bet+me.chips;$("range").min=Math.max(st.currentBet+1,mn);$("range").max=Math.max(+$("range").min,mx);if(+$("range").value<+$("range").min||+$("range").value>+$("range").max)$("range").value=$("range").min;$("rv").textContent=money(+$("range").value)}
</script></body></html>
