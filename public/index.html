<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>민국 홀덤 온라인 v3</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#06110c;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.w{max-width:1120px;margin:auto;padding:12px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.headBtns{display:flex;gap:6px;align-items:center}
.tag{background:#e9c46a;color:#111;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:900}
.p{background:#ffffff10;border:1px solid #ffffff20;border-radius:15px;padding:13px;margin:8px 0}
.row{display:flex;gap:7px;flex-wrap:wrap}
input,select,button{border:0;border-radius:9px;padding:10px;font-weight:800}
input,select{background:#fff;color:#111}
button{cursor:pointer}
button:disabled{opacity:.38;cursor:not-allowed}
.g{background:#e9c46a}.r{background:#ef476f;color:#fff}.b{background:#4cc9f0}
.soundBtn{padding:7px 10px;background:#ffffff18;color:#fff;border:1px solid #ffffff20}
.table{height:650px;position:relative;border-radius:45%/32%;background:radial-gradient(ellipse,#168057,#0d6744 55%,#063d29);border:13px solid #432916;overflow:hidden;box-shadow:0 20px 60px #0008}
.center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;width:70%}
.pot{display:inline-block;background:#0008;padding:7px 13px;border-radius:20px;font-weight:900}
.board,.cards{display:flex;justify-content:center;gap:6px}
.board{min-height:82px;margin:9px}
.card{width:55px;height:78px;background:#fff;color:#111;border-radius:7px;padding:5px;font-weight:900;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 10px #0006}
.redc{color:#d62828}.suit{font-size:24px;text-align:center}
.back{background:repeating-linear-gradient(45deg,#133b8b,#133b8b 7px,#2461d5 7px,#2461d5 14px);border:2px solid white}
.seat{position:absolute;width:170px;text-align:center}.box{background:#0009;border:1px solid #ffffff22;border-radius:12px;padding:7px}
.active .box{outline:3px solid #e9c46a;box-shadow:0 0 18px #e9c46a88}.fold{opacity:.42}
.cards{height:62px}.cards .card{width:42px;height:59px}.cards .suit{font-size:18px}
.s0{left:50%;bottom:14px;transform:translateX(-50%)}.s1{left:6%;bottom:115px}.s2{left:5%;top:100px}.s3{left:50%;top:10px;transform:translateX(-50%)}.s4{right:5%;top:100px}.s5{right:6%;bottom:115px}
.ctrl{position:absolute;left:50%;bottom:116px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:80%;z-index:4}
.raisebox{background:#0008;padding:4px;border-radius:9px;display:flex;gap:5px;align-items:center}
input[type=range]{padding:0;width:130px}
.small{font-size:12px;color:#bed1c6}.msg{font-weight:900;color:#ffe29a;margin-top:8px}.hide{display:none}.invite{word-break:break-all;color:#bde0fe}
.waiting{font-size:13px;color:#ffd166;font-weight:800;align-self:center}
.chat{margin-top:10px;display:grid;grid-template-rows:auto 180px auto;gap:8px}
.chatTitle{display:flex;justify-content:space-between;align-items:center;font-weight:900}
.chatList{background:#020906;border:1px solid #ffffff18;border-radius:11px;padding:9px;overflow-y:auto}
.chatMsg{padding:4px 2px;font-size:14px;line-height:1.35;word-break:break-word}
.chatMsg .who{font-weight:900;color:#e9c46a;margin-right:6px}
.chatMsg.system{color:#93a69b;font-size:12px}
.chatMsg.system .who{color:#93a69b}
.chatInput{display:flex;gap:6px}.chatInput input{flex:1;min-width:0}.chatInput button{min-width:74px}
@media(max-width:720px){
 .table{height:720px;border-radius:26px}.seat{width:128px}
 .s1{left:2px;bottom:115px}.s5{right:2px;bottom:115px}.s2{left:2px;top:120px}.s4{right:2px;top:120px}
 .center{top:43%;width:96%}.ctrl{bottom:145px;width:96%}.card{width:46px;height:66px}
 .chat{grid-template-rows:auto 145px auto}.p{padding:10px}
}

.turnBanner{
  margin:10px auto 4px;display:inline-block;padding:9px 18px;border-radius:14px;
  background:#071b12;border:2px solid #e9c46a;color:#ffe39a;font-size:22px;font-weight:1000;
  box-shadow:0 0 18px #e9c46a66;min-width:180px
}
.actionTag{
  margin-top:5px;display:inline-block;padding:4px 9px;border-radius:999px;
  background:#e9c46a;color:#111;font-size:12px;font-weight:1000
}
.ctrl.disabledTurn{opacity:.35;filter:grayscale(.25)}
.ctrl.enabledTurn{opacity:1}


.timerWrap{margin-top:8px;font-weight:900}
.timerNormal{color:#d7e3dc}
.timerWarn{color:#ffd166;font-size:20px}
.timerDanger{color:#ff6b6b;font-size:28px;animation:pulseTimer .55s ease-in-out infinite alternate}
@keyframes pulseTimer{from{transform:scale(1)}to{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.timerDanger{animation:none}}


/* Realistic playing-card face */
.card{
  position:relative;
  width:64px;height:90px;
  background:linear-gradient(145deg,#ffffff 0%,#fbfbf7 70%,#f1f1eb 100%);
  color:#111;border-radius:8px;
  border:1px solid #d5d5cf;
  padding:0;
  box-shadow:0 4px 10px #0007, inset 0 0 0 1px #ffffff;
  overflow:hidden;
  font-family:Georgia,"Times New Roman",serif;
}
.card.redc{color:#d51f2a}
.card .corner{
  position:absolute;left:4px;top:3px;
  width:17px;text-align:center;line-height:.85;
  font-weight:900;font-size:15px;z-index:3
}
.card .corner .cornerSuit{display:block;font-size:13px;line-height:1;margin-top:2px}
.card .corner.bottom{
  left:auto;right:4px;top:auto;bottom:3px;
  transform:rotate(180deg)
}
.card .pipArea{position:absolute;inset:8px 13px}
.card .pip{
  position:absolute;transform:translate(-50%,-50%);
  font-size:19px;line-height:1;font-weight:700
}
.card .pip.flip{transform:translate(-50%,-50%) rotate(180deg)}
.card .acePip{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:42px;line-height:1
}
.card .faceCenter{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:36px;height:55px;border:1px solid currentColor;border-radius:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;background:linear-gradient(#fff,#f4f0df);
  box-shadow:inset 0 0 0 2px #ffffff
}
.card .faceCenter .faceRank{font-size:23px;line-height:1}
.card .faceCenter .faceSuit{font-size:22px;line-height:1;margin-top:4px}
.card.back{
  background:
   linear-gradient(45deg,transparent 45%,#dce8ff 45%,#dce8ff 55%,transparent 55%),
   linear-gradient(-45deg,transparent 45%,#dce8ff 45%,#dce8ff 55%,transparent 55%),
   #154ca3;
  background-size:12px 12px;
  border:4px solid #fff;
  box-shadow:0 4px 10px #0008,inset 0 0 0 2px #17417d
}
.card.back:after{
  content:"";position:absolute;inset:5px;border:2px solid #d9e6ff;border-radius:3px
}
.cards .card{width:50px;height:70px;border-radius:6px}
.cards .card .corner{font-size:12px;width:14px;left:3px;top:3px}
.cards .card .corner.bottom{left:auto;right:3px;top:auto;bottom:3px}
.cards .card .corner .cornerSuit{font-size:10px}
.cards .card .pipArea{inset:7px 10px}
.cards .card .pip{font-size:14px}
.cards .card .acePip{font-size:31px}
.cards .card .faceCenter{width:28px;height:43px}
.cards .card .faceCenter .faceRank{font-size:18px}
.cards .card .faceCenter .faceSuit{font-size:16px}


.actionTag{
  margin-top:6px;
  display:inline-block;
  padding:5px 10px;
  border-radius:999px;
  background:#f3cf63;
  color:#111;
  font-size:13px;
  font-weight:1000;
  border:1px solid #fff2a8;
  box-shadow:0 0 10px #0005
}
.actionTag.win{font-size:16px;padding:7px 12px;
  background:#fff1a8;
  color:#7b5200;
  font-size:14px;
  border:2px solid #ffd34e;
  box-shadow:0 0 14px #ffd34e88
}
.actionToast{
  position:absolute;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  z-index:8;
  background:#071b12ee;
  border:2px solid #e9c46a;
  border-radius:14px;
  padding:9px 16px;
  font-size:20px;
  font-weight:1000;
  color:#ffe39a;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease
}
.actionToast.show{opacity:1}


.msg.winnerMsg{
  margin-top:10px;
  display:inline-block;
  padding:8px 14px;
  border-radius:12px;
  background:#fff1a8;
  color:#6e4b00;
  border:2px solid #ffd34e;
  font-size:20px;
  font-weight:1000;
  box-shadow:0 0 14px #ffd34e66
}

</style>
</head>
<body>
<div class="w">
  <div class="head">
    <h2>♠ 민국 홀덤</h2>
    <div class="headBtns"><button id="sound" class="soundBtn">🔊 효과음 ON</button><button id="voice" class="soundBtn">🗣 음성 ON</button><span class="tag">ONLINE v4</span></div>
  </div>

  <div id="lobby" class="p"><div id="normalLobby">
    <div class="row">
      <input id="name" value="" placeholder="닉네임 입력">
      <input id="pw" placeholder="방 비밀번호(선택)">
      <select id="startchips"><option value="5000">5,000칩</option><option value="10000" selected>10,000칩</option><option value="20000">20,000칩</option><option value="50000">50,000칩</option></select>
      <select id="blind"><option value="25,50">25/50</option><option value="50,100" selected>50/100</option><option value="100,200">100/200</option></select>
      <select id="max"><option>2</option><option>4</option><option selected>6</option></select>
      <button class="g" id="create">방 만들기</button>
    </div>
    <hr style="border-color:#ffffff18">
    <div class="row"><input id="code" maxlength="5" placeholder="방 코드"><input id="jpw" placeholder="비밀번호"><button id="join">방 입장</button></div>
    <div class="small" style="margin-top:8px">무료 게임 포인트 전용 · 2명 이상부터 게임 시작 · 최대 6명</div>
    </div>
    <div id="inviteLobby" class="hide">
      <div style="font-weight:900;margin-bottom:10px">♠ 초대받은 홀덤방 입장</div>
      <div class="row">
        <input id="inviteName" placeholder="닉네임">
        <input id="invitePw" placeholder="비밀번호">
        <button class="g" id="inviteJoin">방 입장</button>
      </div>
    </div>
  </div>

  <div id="game" class="hide">
    <div class="p">
      <div class="row" style="justify-content:space-between">
        <div>방 <b id="rcode"></b> · <span id="phase"></span> · <b id="people"></b></div>
        <div class="row">
          <button id="copy">초대 링크 복사</button><button class="r" id="leaveRoom">나가기</button>
          <span id="waiting" class="waiting"></span>
          <button class="g" id="start">🎮 게임 시작</button>
        </div>
      </div>
      <div class="invite" id="invite"></div>
    </div>

    <div class="table">
      <div class="center">
        <div class="pot" id="pot"></div>
        <div class="board" id="board"></div>
        <div class="small" id="street"></div>
        <div class="turnBanner" id="turnBanner">대기 중</div><div class="timerWrap" id="turnTimer"></div><div class="msg" id="msg"></div>
      </div>
      <div id="s0" class="seat s0"></div><div id="s1" class="seat s1"></div><div id="s2" class="seat s2"></div>
      <div id="s3" class="seat s3"></div><div id="s4" class="seat s4"></div><div id="s5" class="seat s5"></div>
      <div class="actionToast" id="actionToast"></div><div class="ctrl">
        <button class="r" id="fold">FOLD</button>
        <button id="call">CHECK</button>
        <div class="raisebox"><input type="range" id="range" step="10"><span id="rv"></span><button class="b" id="raise">RAISE</button></div>
        <button class="g" id="allin">ALL-IN</button>
      </div>
    </div>

    <div class="p chat">
      <div class="chatTitle"><span>💬 테이블 채팅</span><span class="small">최대 160자</span></div>
      <div id="chatList" class="chatList"></div>
      <div class="chatInput"><input id="chatText" maxlength="160" placeholder="친구들에게 메시지를 입력하세요"><button class="b" id="sendChat">전송</button></div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const s=io(),$=x=>document.getElementById(x),money=n=>(n||0).toLocaleString("ko-KR");
let st=null, prev=null, soundOn=true, voiceOn=true, audioCtx=null, chatInitialized=false,turnTick=null,lastSpokenCountdown=null;
function speak(text){
  if(!voiceOn||!("speechSynthesis" in window)||!text)return;
  try{
    const synth=window.speechSynthesis;
    synth.resume();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ko-KR";
    u.rate=1.0;
    u.pitch=1;
    const voices=synth.getVoices();
    const ko=voices.find(v=>/ko-KR/i.test(v.lang))||voices.find(v=>/^ko/i.test(v.lang));
    if(ko)u.voice=ko;
    synth.cancel();
    setTimeout(()=>synth.speak(u),30);
  }catch(e){}
}
const q=new URLSearchParams(location.search);
const invitedRoom=(q.get("room")||"").toUpperCase();
if(invitedRoom){
  $("code").value=invitedRoom;
  $("normalLobby").classList.add("hide");
  $("inviteLobby").classList.remove("hide");
}

function unlockAudio(){
  if(!soundOn)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended")audioCtx.resume();
  }catch(e){}
}
function tone(freq=440,dur=.08,type="sine",vol=.05,delay=0){
  if(!soundOn)return;unlockAudio();if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),now=audioCtx.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+.01);g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+dur+.02);
}
function fx(name){
  if(name==="click")tone(230,.05,"square",.025);
  if(name==="join"){tone(520,.07,"sine",.04);tone(700,.09,"sine",.04,.08)}
  if(name==="deal"){tone(210,.055,"triangle",.035);tone(260,.055,"triangle",.035,.07);tone(320,.055,"triangle",.035,.14)}
  if(name==="card"){tone(330,.045,"triangle",.03);tone(410,.05,"triangle",.025,.05)}
  if(name==="turn"){tone(620,.08,"sine",.055);tone(820,.1,"sine",.05,.10)}
  if(name==="win"){tone(523,.12,"sine",.05);tone(659,.12,"sine",.05,.13);tone(784,.22,"sine",.055,.26)}
  if(name==="chat")tone(470,.055,"sine",.025);
}
$("sound").onclick=()=>{soundOn=!soundOn;$("sound").textContent=soundOn?"🔊 효과음 ON":"🔇 효과음 OFF";if(soundOn){unlockAudio();fx("click")}};
$("voice").onclick=()=>{voiceOn=!voiceOn;$("voice").textContent=voiceOn?"🗣 음성 ON":"🔇 음성 OFF";if(voiceOn)speak("음성 안내를 시작합니다")};

const PIP_LAYOUTS={
  "2":[[50,22,0],[50,78,1]],
  "3":[[50,20,0],[50,50,0],[50,80,1]],
  "4":[[28,22,0],[72,22,0],[28,78,1],[72,78,1]],
  "5":[[28,20,0],[72,20,0],[50,50,0],[28,80,1],[72,80,1]],
  "6":[[28,18,0],[72,18,0],[28,50,0],[72,50,0],[28,82,1],[72,82,1]],
  "7":[[28,17,0],[72,17,0],[50,34,0],[28,50,0],[72,50,0],[28,83,1],[72,83,1]],
  "8":[[28,16,0],[72,16,0],[50,32,0],[28,48,0],[72,48,0],[50,64,1],[28,84,1],[72,84,1]],
  "9":[[28,15,0],[72,15,0],[28,35,0],[72,35,0],[50,50,0],[28,65,1],[72,65,1],[28,85,1],[72,85,1]],
  "10":[[28,13,0],[72,13,0],[50,27,0],[28,38,0],[72,38,0],[28,62,1],[72,62,1],[50,73,1],[28,87,1],[72,87,1]]
};
function card(c,b=false){
  if(b)return '<div class="card back" aria-label="뒷면 카드"></div>';
  const red=(c.s==="♥"||c.s==="♦");
  const cls=red?" redc":"";
  const label=`${c.r}${c.s}`;
  const corner=`<div class="corner"><span>${c.r}</span><span class="cornerSuit">${c.s}</span></div>
                <div class="corner bottom"><span>${c.r}</span><span class="cornerSuit">${c.s}</span></div>`;
  let center="";
  if(c.r==="A"){
    center=`<div class="acePip">${c.s}</div>`;
  }else if(c.r==="J"||c.r==="Q"||c.r==="K"){
    center=`<div class="faceCenter"><span class="faceRank">${c.r}</span><span class="faceSuit">${c.s}</span></div>`;
  }else{
    const pips=(PIP_LAYOUTS[c.r]||[]).map(([x,y,flip])=>
      `<span class="pip${flip?" flip":""}" style="left:${x}%;top:${y}%">${c.s}</span>`
    ).join("");
    center=`<div class="pipArea">${pips}</div>`;
  }
  return `<div class="card${cls}" aria-label="${label}">${corner}${center}</div>`;
}
$("create").onclick=()=>{unlockAudio();const n=$("name").value.trim();if(!n){alert("닉네임을 입력해주세요.");$("name").focus();return}fx("click");let [sb,bb]=$("blind").value.split(",").map(Number);s.emit("create",{name:n,password:$("pw").value,start:+$("startchips").value,sb,bb,max:+$("max").value})};
$("join").onclick=()=>{unlockAudio();const n=$("name").value.trim();if(!n){alert("닉네임을 입력해주세요.");$("name").focus();return}fx("click");s.emit("join",{code:$("code").value,password:$("jpw").value,name:n})};
$("inviteJoin").onclick=()=>{unlockAudio();const n=$("inviteName").value.trim();if(!n){alert("닉네임을 입력해주세요.");$("inviteName").focus();return}fx("click");s.emit("join",{code:invitedRoom,password:$("invitePw").value,name:n})};
$("inviteName").addEventListener("keydown",e=>{if(e.key==="Enter")$("inviteJoin").click()});
$("invitePw").addEventListener("keydown",e=>{if(e.key==="Enter")$("inviteJoin").click()});
$("start").onclick=()=>{unlockAudio();fx("deal");s.emit("start")};
$("fold").onclick=()=>{fx("click");s.emit("act",{type:"fold"})};
$("call").onclick=()=>{fx("click");s.emit("act",{type:"call"})};
$("raise").onclick=()=>{fx("click");s.emit("act",{type:"raise",amount:+$("range").value})};
$("allin").onclick=()=>{fx("click");s.emit("act",{type:"allin"})};
$("range").oninput=e=>$("rv").textContent=money(+e.target.value);
$("copy").onclick=async()=>{let u=location.origin+location.pathname+"?room="+st.code;try{await navigator.clipboard.writeText(u);alert("초대 링크를 복사했습니다.")}catch(e){prompt("이 링크를 복사하세요",u)}};

$("leaveRoom").onclick=()=>{
  if(!st||st.phase==="playing")return;
  if(confirm("이 방에서 나가시겠습니까?")){
    s.emit("leaveRoom");
  }
};
s.on("leftRoom",()=>{
  st=null;prev=null;chatInitialized=false;lastSpokenCountdown=null;
  $("game").classList.add("hide");
  $("lobby").classList.remove("hide");
  $("chatList").innerHTML="";
  history.replaceState(null,"",location.pathname);
  $("normalLobby").classList.remove("hide");
  $("inviteLobby").classList.add("hide");
});

function sendChat(){
  unlockAudio();const t=$("chatText").value.trim();if(!t)return;s.emit("chat",{text:t});$("chatText").value="";
}
$("sendChat").onclick=sendChat;
$("chatText").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendChat()}});

function appendChat(m,play=false){
  if(m.system)return;
  const list=$("chatList"),row=document.createElement("div");row.className="chatMsg"+(m.system?" system":"");
  const who=document.createElement("span");who.className="who";who.textContent=m.system?"●":m.name;
  const text=document.createElement("span");text.textContent=(m.system?" ":" : ")+m.text;
  row.append(who,text);list.appendChild(row);
  while(list.children.length>60)list.removeChild(list.firstChild);
  list.scrollTop=list.scrollHeight;
  if(play&&!m.system)fx("chat");
}
s.on("chat",m=>appendChat(m,true));
s.on("announce",m=>{
  unlockAudio();
  fx("chat");
  const t=$("actionToast");
  if(t){
    t.textContent=m.text;
    t.classList.add("show");
    clearTimeout(window.__actionToastTimer);
    window.__actionToastTimer=setTimeout(()=>t.classList.remove("show"),1400);
  }
  speak(m.text);
});
s.on("err",m=>alert(m));
s.on("state",x=>{
  prev=st;st=x;
  $("lobby").classList.add("hide");$("game").classList.remove("hide");
  if(!chatInitialized){
    $("chatList").innerHTML="";
    (x.chat||[]).forEach(m=>appendChat(m,false));
    chatInitialized=true;
  }
  soundFromState(prev,x);
  ensureTurnTicker();updateTurnTimer();render();
});
function soundFromState(a,b){
  if(!a)return;
  if((b.connectedCount||0)>(a.connectedCount||0))fx("join");
  if(b.phase==="playing"&&a.phase!=="playing")fx("deal");
  if((b.board?.length||0)>(a.board?.length||0))fx("card");
  const nowMine=b.turn>=0&&b.players[b.turn]?.token===b.me;
  const wasMine=a.turn>=0&&a.players[a.turn]?.token===a.me;
  if(nowMine&&!wasMine)fx("turn");
  if(b.phase==="showdown"&&a.phase!=="showdown")fx("win");
}


function speakCountdownNumber(n){
  if(!voiceOn||!("speechSynthesis" in window))return;
  const words={5:"Five",4:"Four",3:"Three",2:"Two",1:"One"};
  const word=words[n];
  if(!word)return;
  try{
    const synth=window.speechSynthesis;
    synth.resume();
    const u=new SpeechSynthesisUtterance(word);
    u.lang="en-US";u.rate=.9;u.pitch=1;
    const voices=synth.getVoices();
    const en=voices.find(v=>/en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));
    if(en)u.voice=en;
    synth.cancel();
    setTimeout(()=>synth.speak(u),20);
  }catch(e){}
}
function updateTurnTimer(){
  if(!st){return}
  const e=$("turnTimer");
  if(st.phase!=="playing"||st.turn<0){e.textContent="";e.className="timerWrap";return}
  if(st.countdownValue!==null&&st.countdownValue!==undefined){
    const n=Number(st.countdownValue);
    e.textContent=`자동 다이까지 ${n}`;
    e.className="timerWrap timerDanger";
    if(n>=1&&n<=5&&lastSpokenCountdown!==n){
      lastSpokenCountdown=n;
      speakCountdownNumber(n);
    }
    return;
  }else{
    lastSpokenCountdown=null;
  }
  const remain=Math.max(0,Math.ceil(((st.turnDeadline||0)-Date.now())/1000));
  if(remain>5){
    e.textContent=`생각할 시간 ${Math.max(0,remain-5)}초`;
    e.className="timerWrap timerNormal";
  }else{
    e.textContent=remain>0?`카운트 ${remain}`:"";
    e.className="timerWrap timerWarn";
  }
}
function ensureTurnTicker(){
  if(turnTick)return;
  turnTick=setInterval(updateTurnTimer,250);
}
function render(){updateTurnTimer();
  let mi=st.players.findIndex(p=>p.token===st.me),me=st.players[mi],connected=st.connectedCount??st.players.filter(p=>p.connected).length;
  $("rcode").textContent=st.code;$("people").textContent=`접속 ${connected}명`;
  $("phase").textContent=st.phase==="lobby"?"대기실":st.phase==="playing"?"게임 중":"핸드 종료";
  $("pot").textContent="POT "+money(st.pot);$("board").innerHTML=st.board.map(c=>card(c)).join("");
  $("street").textContent=({preflop:"프리플랍",flop:"플랍",turn:"턴",river:"리버"}[st.street]||"대기")+" · #"+st.handNo+" · "+st.settings.sb+"/"+st.settings.bb;
  $("msg").textContent=st.msg||"";$("msg").classList.toggle("winnerMsg",!!st.msg&&st.msg.startsWith("우승 "));
  const canStart=st.host&&st.phase!=="playing"&&connected>=2;
  $("start").style.display=canStart?"block":"none";$("leaveRoom").style.display=st.phase==="playing"?"none":"block";
  $("waiting").textContent=st.host&&st.phase!=="playing"&&connected<2?"친구 1명 이상 입장하면 시작 가능":"";
  let url=location.origin+location.pathname+"?room="+st.code;$("invite").textContent="초대: "+url;
  const mePlayer=st.players.find(p=>p.token===st.me);
  const others=st.players.filter(p=>p.token!==st.me);
  const ordered=mePlayer?[mePlayer,...others]:[...st.players];
  const dealerToken=(st.dealer>=0&&st.players[st.dealer])?st.players[st.dealer].token:null;
  const turnToken=(st.turn>=0&&st.players[st.turn])?st.players[st.turn].token:null;

  for(let slot=0;slot<6;slot++){
    const p=ordered[slot]||null,e=$("s"+slot);
    if(!p){
      e.innerHTML=`<div class="cards"></div><div class="box" style="opacity:.42"><b>빈자리</b><br><span class="small">EMPTY SEAT</span></div>`;
      e.className="seat s"+slot;
      continue;
    }
    const active=turnToken===p.token&&st.phase==="playing";
    e.className=`seat s${slot}${active?" active":""}${p.folded?" fold":""}`;
    let cs="";
    if(p.cards&&p.cards.length){
      cs=p.cards.map(c=>card(c)).join("");
    }else if(p.inHand&&st.phase==="playing"){
      cs=card(null,true)+card(null,true);
    }
    e.innerHTML=`<div class="cards">${cs}</div><div class="box"><b>${p.name}${p.token===dealerToken?" 🔘":""}${p.token===st.me?" (나)":""}</b><br><span style="color:#f6d365">${money(p.chips)}칩</span><br><span class="small">${p.bet?"BET "+money(p.bet):""} ${p.allin?"ALL-IN":""} ${p.folded?"FOLD":""} ${!p.connected?"OFF":""}</span>${p.lastAction?`<br><span class="actionTag${p.lastAction.startsWith("우승")?" win":""}">${p.lastAction}</span>`:""}</div>`;
  }
  const currentPlayer=(st.turn>=0&&st.players[st.turn])?st.players[st.turn]:null;
  $("turnBanner").textContent=st.phase==="playing"&&currentPlayer?`${currentPlayer.name}님 차례`:(st.phase==="showdown"?"핸드 종료":"대기 중");
  let turn=st.phase==="playing"&&st.turn===mi,call=Math.max(0,st.currentBet-(me?.bet||0));
  const ctrl=document.querySelector(".ctrl");
  ctrl.classList.toggle("enabledTurn",turn);
  ctrl.classList.toggle("disabledTurn",!turn);
  ["fold","call","raise","allin"].forEach(x=>$(x).disabled=!turn);
  $("call").textContent=call?"CALL "+money(Math.min(call,me.chips)):"CHECK";
  let mn=Math.min(me.bet+me.chips,st.currentBet+st.minRaise),mx=me.bet+me.chips;
  $("range").min=Math.max(st.currentBet+1,mn);$("range").max=Math.max(+$("range").min,mx);
  if(+$("range").value<+$("range").min||+$("range").value>+$("range").max)$("range").value=$("range").min;
  $("rv").textContent=money(+$("range").value);
}
</script>
